name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the default token permissions are write-heavy for every job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel:
    name: bazel ${{ matrix.bazel }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bazel: ["8.6.0", "9.2.0"]
    env:
      # Takes precedence over .bazelversion, so one checkout covers both majors.
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.bazel }}
          repository-cache: true
          # Pull requests RESTORE caches but never SAVE them: only reviewed code should
          # populate a cache a later trusted build consumes, and pull-request caches
          # otherwise evict main's from the shared repository quota. Gated on the ref
          # rather than the event, because workflow_dispatch can target any branch.
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # Formatting is a test target, so this covers it too.
      - name: the ruleset
        run: bazel test //...

      # The fallback path. Compiling without the worker is what someone debugging a
      # misbehaving compile falls back to, so it has to keep working; running the same
      # tests both ways is the only thing that keeps it honest.
      - name: without the worker
        run: bazel test //tests/... --@rules_clj//clojure:worker=false

      # examples/ is in .bazelignore: each is its own module, consuming rules_clj the
      # way a stranger would, and is the only place the rules are exercised end to end.
      #
      # examples/native is absent on purpose: building it downloads a GraalVM, which is
      # not a reasonable thing to make every pull request pay for. It is exercised by
      # hand; see its README.
      - name: examples/hello
        working-directory: examples/hello
        run: bazel test //...

      - name: examples/deps_edn
        working-directory: examples/deps_edn
        run: bazel test //...

      - name: examples/tidy
        working-directory: examples/tidy
        run: bazel test //...

      - name: examples/cljs
        working-directory: examples/cljs
        run: bazel build //src/web:app

      # The generated BUILD files must match the ns forms they came from. Editing an ns
      # without regenerating fails here rather than being found by the next person.
      - name: BUILD files are not stale
        run: |
          bazel run //tools/tidy -- \
            --root="$PWD/examples/tidy/src" \
            --strip-prefix=src --package-prefix=src --mode=check

      # No JDK setup step: .bazelrc selects a hermetic remotejdk_21 for target and tool.

  # The single check branch protection requires, and the only reason this job exists.
  #
  # A required status check is matched by CHECK RUN name, which for a matrix is the
  # generated one — "bazel 9.2.0 (ubuntu-latest)" and its three siblings — not the
  # workflow's name. Requiring those directly works until the matrix changes: bump
  # 9.2.0 to 9.3.0 and the required check can never report again, so every pull request
  # is blocked by something that will never turn green. Requiring one aggregate instead
  # leaves the matrix free to change.
  #
  # if: always() so it runs even when a leg fails — a skipped job reports nothing, and a
  # required check that never reports blocks the pull request instead of failing it.
  ci:
    name: ci
    needs: [bazel, tools-deps-examples]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every job must have succeeded
        run: |
          echo "bazel:                ${{ needs.bazel.result }}"
          echo "tools-deps-examples:  ${{ needs.tools-deps-examples.result }}"
          if [ "${{ needs.bazel.result }}" != "success" ] || \
             [ "${{ needs.tools-deps-examples.result }}" != "success" ]; then
            echo "::error::CI did not pass" >&2
            exit 1
          fi
